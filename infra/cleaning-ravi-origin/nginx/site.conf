# 호스트명 = 사이트 폴더. 서브도메인이 늘어도 설정 변경이 필요 없다.
#
# 이미지 같은 공통 에셋은 사이트마다 복사하지 않고 shared 한 벌만 둔다.
# (레거시 keyword_ranking/scripts/deploy-gosim-ec2-rollout.mjs 와 같은 방식)
# 사이트 1,000개 기준 배포 전송량이 380MiB -> 70MiB 로 줄어든다.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /srv/group-page-origin/sites/$host;
  index index.html;

  location /img/ {
    root /srv/group-page-origin/shared;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # 파비콘도 사이트마다 복사하지 않고 shared 한 벌을 쓴다.
  location ~ ^/(favicon\.ico|favicon\.svg|favicon-32\.png|apple-touch-icon\.png)$ {
    root /srv/group-page-origin/shared;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # /1 로 들어와도 /1.html 을 찾아준다.
  location / { try_files $uri $uri.html $uri/index.html =404; }

  gzip on;
  gzip_types text/html text/css application/xml application/rss+xml application/json;
  gzip_min_length 512;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;
  root /srv/group-page-origin/sites/$host;
  index index.html;

  # Cloudflare SSL 모드가 full 이라 오리진 인증서는 검증되지 않는다.
  # full (strict) 로 올릴 때 Cloudflare Origin CA 인증서로 교체한다.
  ssl_certificate     /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location /img/ {
    root /srv/group-page-origin/shared;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # 파비콘도 사이트마다 복사하지 않고 shared 한 벌을 쓴다.
  location ~ ^/(favicon\.ico|favicon\.svg|favicon-32\.png|apple-touch-icon\.png)$ {
    root /srv/group-page-origin/shared;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  location / { try_files $uri $uri.html $uri/index.html =404; }

  gzip on;
  gzip_types text/html text/css application/xml application/rss+xml application/json;
  gzip_min_length 512;
}
