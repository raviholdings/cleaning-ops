<section class="band {{bandClass}}" data-reveal id="services">
  <div class="wrap">
    <h2>{{heading}}</h2>
    <ul class="grid cards">
      {{#services}}<li class="card" data-reveal><div class="card-ico">{{{icon}}}</div><div class="card-body"><h3>{{name}}</h3><p>{{desc}}</p></div></li>{{/services}}
    </ul>
    <p class="also">{{alsoNote}}</p>
  </div>
</section>
