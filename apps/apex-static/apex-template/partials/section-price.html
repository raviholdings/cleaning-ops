<section class="band {{bandClass}}" data-reveal id="price">
  <div class="wrap narrow">
    <h2>{{heading}}</h2>
    <p class="body">{{priceNote}}</p>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th scope="col">항목</th><th scope="col">구분</th></tr></thead>
        <tbody>{{#priceRows}}<tr><th scope="row">{{item}}</th><td>{{range}}</td></tr>{{/priceRows}}</tbody>
      </table>
    </div>
  </div>
</section>
