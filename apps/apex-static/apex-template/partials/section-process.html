<section class="band {{bandClass}}" data-reveal id="process">
  <div class="wrap">
    <h2>{{heading}}</h2>
    <ol class="steps">
      {{#process}}<li data-reveal><div class="step-num" aria-hidden="true"></div><div class="step-body"><h3>{{step}}</h3><p>{{note}}</p></div></li>{{/process}}
    </ol>
  </div>
</section>
