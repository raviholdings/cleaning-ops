<section class="band {{bandClass}}" data-reveal id="reviews">
  <div class="wrap">
    <h2>{{heading}}</h2>
    <ul class="reviews">
      {{#reviews}}<li data-reveal><div class="rev-stars" aria-hidden="true">★★★★★</div><p>{{text}}</p><div class="rev-foot"><span class="meta">{{meta}}</span><span class="rev-badge">인증 고객</span></div></li>{{/reviews}}
    </ul>
  </div>
</section>
