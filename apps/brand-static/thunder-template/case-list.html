<div class="wrap">
  <div class="hero">
    <span class="eyebrow">작업 사례</span>
    <h1>실제로 <span class="b">있었던 일</span></h1>
    <p class="sub">어떤 증상으로 접수됐고 실제 원인이 무엇이었는지 정리했습니다. 총 {{caseCount}}건입니다.</p>
  </div>
</div>
<section class="alt"><div class="wrap">
  <div class="rows">
    {{#cases}}<div class="row"><div class="n word">→</div><div>
      <h3><a href="{{href}}">{{title}}</a></h3>
      <p>{{#area}}{{area}} · {{/area}}{{summary}}</p></div></div>{{/cases}}
  </div>
</div></section>

<section id="ask"><div class="wrap">
  <div class="askbar">
    <p class="askt">지금 안 내려가면 그냥 두지 마세요. 하루가 지나면 일이 커집니다.</p>
    <p class="aska"><a class="askc" href="tel:{{phoneRaw}}">{{phone}}</a><a class="askf" href="/form/">글로 남기기</a></p>
  </div>
</div></section>
