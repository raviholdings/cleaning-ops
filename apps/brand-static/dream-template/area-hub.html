<div class="wrap">
  <div class="phead">
    <p class="kicker rise" style="animation-delay:.05s">서비스 지역</p>
    <h1 class="rise" style="animation-delay:.12s">{{{hubHeading}}}</h1>
    <p class="s rise" style="animation-delay:.28s">{{hubLede}}</p>
  </div>
</div>

<section class="hub"><div class="wrap">
  {{#sido}}
  <div class="hubgroup">
    <p class="tag">{{label}} <u>{{count}}</u></p>
    <div class="area">
      {{#items}}<a href="{{href}}">{{label}}</a>{{/items}}
    </div>
  </div>
  {{/sido}}
</div></section>

<section id="ask"><div class="wrap">
  <div class="askbar">
    <p class="askt">막혔으면 미루지 마십시오. 오래 둘수록 손댈 곳이 늘어납니다.</p>
    <p class="aska"><a class="askc" href="tel:{{phoneRaw}}">{{phone}}</a><a class="askf" href="/form/">글로 남기기</a></p>
  </div>
</div></section>
